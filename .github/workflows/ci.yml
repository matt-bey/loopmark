name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both maintained LTS lines. Node 20 is end-of-life, and testing only
        # the version this was written on would make the `engines` field a
        # claim nobody had checked.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build first: test/integration.test.ts evaluates dist/loopmark.bundle.js,
      # so a stale bundle would otherwise be what gets tested.
      - name: Build bookmarklet
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      # The load-bearing check. See SECURITY.md.
      - name: Zero-network gate
        run: npm run check:no-network

      - name: Fixture scrub gate
        run: npm run check:fixtures

      # dist/ is committed so users can grab the bookmarklet without a
      # toolchain. That is only trustworthy if it actually matches the source,
      # so a rebuild must produce no diff.
      - name: dist/ matches source
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi
          echo "dist/ is reproducible from source."

  # Publish dist/ to GitHub Pages so the install page can be opened directly,
  # rather than cloned and built.
  #
  # `needs: verify` is the point of this job's shape: nothing reaches the
  # hosted page unless the zero-network gate, the fixture scrub and the
  # dist/-matches-source check have all passed. A hosted installer that could
  # publish an unverified payload would be strictly worse than asking people
  # to build it themselves.
  #
  # Opt-in, via a repository variable rather than by merely existing. Without
  # the gate this job would RUN and FAIL on the first push to a repo that has
  # not enabled Pages yet -- a red X on a perfectly good commit, for a feature
  # nobody had switched on.
  #
  # To publish, once:
  #   1. Settings -> Pages -> Source: "GitHub Actions"
  #   2. Settings -> Secrets and variables -> Actions -> Variables tab ->
  #      New repository variable: PUBLISH_PAGES = true
  # then push to main, or run this workflow manually from the Actions tab.
  #
  # The ref check alone is enough to keep pull requests out: a PR run reports
  # `github.ref` as `refs/pull/N/merge`, never `refs/heads/main`. Testing the
  # event name as well would add nothing except to block `workflow_dispatch`,
  # which is the one way to publish without inventing a commit to push.
  publish:
    needs: verify
    if: vars.PUBLISH_PAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The committed dist/ is what gets published, not a fresh build: `verify`
      # has already proved it is reproducible from source, and publishing the
      # reviewed bytes keeps the hosted payload identical to the one in the
      # repository that CHECKSUMS.txt describes.
      - name: Stage the install page
        run: |
          mkdir -p _site
          cp dist/install.html _site/index.html
          cp dist/loopmark.bookmarklet.txt dist/loopmark.bundle.js dist/CHECKSUMS.txt _site/
          echo "Published $(cat dist/CHECKSUMS.txt | grep -v '^#')"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
