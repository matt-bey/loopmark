name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build first: test/integration.test.ts evaluates dist/loopmark.bundle.js,
      # so a stale bundle would otherwise be what gets tested.
      - name: Build bookmarklet
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      # The load-bearing check. See SECURITY.md.
      - name: Zero-network gate
        run: npm run check:no-network

      - name: Fixture scrub gate
        run: npm run check:fixtures

      # dist/ is committed so users can grab the bookmarklet without a
      # toolchain. That is only trustworthy if it actually matches the source,
      # so a rebuild must produce no diff.
      - name: dist/ matches source
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi
          echo "dist/ is reproducible from source."
