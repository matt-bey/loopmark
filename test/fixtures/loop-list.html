<!--
  Loop's real list markup, reproduced from a saved page on 2026-09-16.

  Loop never nests lists in the DOM. Every item is its own single-item <ul>,
  wrapped in a `.scriptor-paragraph.scriptor-listItem`, as a flat sibling.
  Depth is `aria-level`; position is `aria-posinset`; and because Loop renders
  its own markers there are no <ol> elements at all -- a numbered list is only
  identifiable by the `--scriptor-list-marker-text` custom property.
-->
<div class="scriptor-pageContainer">
  <div class="scriptor-pageBody">

    <div class="scriptor-paragraph scriptor-listItem">
      <ul>
        <li class="scriptor-listItem-marker-bullet" aria-level="1" aria-posinset="1" aria-setsize="3"
            style="--scriptor-list-marker-text: '&#8226; '">
          <span class="scriptor-textRun scriptor-inline">Pull secure image</span>
        </li>
      </ul>
    </div>

    <div class="scriptor-paragraph scriptor-listItem">
      <ul>
        <li class="scriptor-listItem-marker-bullet" aria-level="1" aria-posinset="2" aria-setsize="3"
            style="--scriptor-list-marker-text: '&#8226; '">
          <span class="scriptor-textRun scriptor-inline">Hardening and configuration</span>
        </li>
      </ul>
    </div>

    <div class="scriptor-paragraph scriptor-listItem">
      <ul>
        <li aria-level="2" aria-posinset="1" aria-setsize="2"
            style="--scriptor-list-marker-text: '1. '">
          <span class="scriptor-textRun scriptor-inline">Install OS packages</span>
        </li>
      </ul>
    </div>

    <div class="scriptor-paragraph scriptor-listItem">
      <ul>
        <li class="scriptor-listItem-marker-bullet" aria-level="3" aria-posinset="1" aria-setsize="1"
            style="--scriptor-list-marker-text: '&#8226; '">
          <span class="scriptor-textRun scriptor-inline">Deepest note</span>
        </li>
      </ul>
    </div>

    <div class="scriptor-paragraph scriptor-listItem">
      <ul>
        <li aria-level="2" aria-posinset="2" aria-setsize="2"
            style="--scriptor-list-marker-text: '2. '">
          <span class="scriptor-textRun scriptor-inline">Install certificate</span>
        </li>
      </ul>
    </div>

    <div class="scriptor-paragraph scriptor-listItem">
      <ul>
        <li class="scriptor-listItem-marker-bullet" aria-level="1" aria-posinset="3" aria-setsize="3"
            style="--scriptor-list-marker-text: '&#8226; '">
          <span class="scriptor-textRun scriptor-inline">Tag and push</span>
        </li>
      </ul>
    </div>

  </div>
</div>
